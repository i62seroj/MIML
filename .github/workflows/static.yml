name: Build and deploy Sphinx documentation

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install sphinx sphinx-book-theme

      - name: Build documentation
        run: |
          sphinx-build -b html docs/source docs/build/html

      - name: Check generated documentation
        run: |
          echo "======================================"
          echo "Contenido de docs/build/html"
          echo "======================================"
          find docs/build/html -maxdepth 2 -type f | sort

          echo ""
          echo "======================================"
          echo "Comprobando index.html"
          echo "======================================"
          test -f docs/build/html/index.html

          echo ""
          echo "index.html encontrado correctamente:"
          ls -lh docs/build/html/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4